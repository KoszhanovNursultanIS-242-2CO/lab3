version: "3.9"
services:
  web:
    build: .
    ports:
      - "5000:5000"

  selenium-hub:
    image: selenium/hub:4.12.0-20240430
    ports:
      - "4444:4444"

  chrome:
    image: selenium/node-chrome:4.12.0-20240430
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443